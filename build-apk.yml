name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Organise files
        run: |
          mkdir -p lib assets
          for f in main.dart config.dart branding.dart; do
            if [ -f "$f" ]; then mv "$f" lib/; fi
          done
          if [ -f ck_enterprises_logo.png ]; then mv ck_enterprises_logo.png assets/; fi
          ls -R lib assets
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --org com.ckenterprises --project-name machinery_running_app .
          sed -i 's/android:label="[^"]*"/android:label="CK Machinery"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
      - name: App icon
        run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/ck_enterprises_logo.png"\n' > flutter_launcher_icons.yaml
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons || echo "Icon step skipped"
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ck-machinery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
