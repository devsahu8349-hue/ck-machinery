name: machinery_running_app
description: CK Enterprises daily machinery running record app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ck_enterprises_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ck_enterprises_logo.png"
